<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mahjong Sabotaje — Motor del Tablero</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <header>
    <h1>Mahjong Sabotaje</h1>
    <label for="shape-select" class="shape-label">Forma:</label>
    <select id="shape-select"></select>
    <span id="game-timer">00:00</span>
    <button id="new-game">Partida Nueva</button>
  </header>

  <div id="dedication">Hecho con cariño para Carol, Mara, Navarro y Piti 💛</div>

  <div id="firebase-status">Firebase: cargando…</div>

  <!-- Room creation/joining test — proves two separate browsers can find
       each other via Firestore. Doesn't touch the actual board yet. -->
  <div id="matchmaking">
    <button id="create-match" disabled>Crear partida</button>
    <span>o</span>
    <input id="room-code-input" placeholder="Código de sala" maxlength="5">
    <button id="join-match" disabled>Unirse</button>
    <span id="room-info"></span>
    <span id="room-error"></span>
  </div>

  <!-- Only "you" has a visible/playable board. "opp" is a status strip only
       (name + tiles remaining + wins) — their actual board lives on their
       own device; we never render or interact with it directly. See
       renderOppStatus in main.js. -->
  <main id="arena">
    <section class="player-panel" data-player="you">
      <div class="panel-header">
        <input class="player-name-input" data-default="Tú" placeholder="Escribe tu nombre" maxlength="20">
        <span class="remaining"></span>
        <span class="wins"></span>
        <span class="panel-message"></span>
      </div>
      <div class="tray-wrap">
        <span class="tray-label">Espacio para guardar fichas:</span>
        <div class="tray" data-owner="you"></div>
      </div>
      <!-- This is the flexible region: it gets whatever vertical space is
           left after the header/tray/power-up-bar take theirs, and tile
           size is computed (main.js computeTileSize) to fit the ENTIRE
           board inside both its width and height — never needs scrolling,
           tiles just shrink as needed, like a photo with object-fit:contain. -->
      <div class="board-scroll">
        <div class="board"></div>
      </div>
      <div class="powerup-bar" data-owner="you"></div>
    </section>

    <section class="player-panel opponent-summary" data-player="opp">
      <input class="player-name-input" data-default="Oponente" placeholder="Nombre del oponente" maxlength="20">
      <span class="remaining"></span>
      <span class="wins"></span>
      <span class="panel-message"></span>
    </section>
  </main>

  <div id="game-over-overlay" class="hidden">
    <div id="game-over-card">
      <p id="game-over-text"></p>
      <button id="game-over-newgame">Partida Nueva</button>
    </div>
  </div>

  <!-- ?v= is a manual cache-buster: python's http.server doesn't send
       Cache-Control headers, so Chrome's heuristic disk cache can keep
       serving an old copy of these files even after a hard reload. Bump
       this number whenever engine.js/powerups.js/main.js change during
       development. -->
  <script src="engine.js?v=11"></script>
  <script src="powerups.js?v=9"></script>
  <script src="main.js?v=16"></script>
  <script type="module" src="firebase-init.js?v=3"></script>
  <script type="module" src="matchmaking.js?v=7"></script>
</body>
</html>
